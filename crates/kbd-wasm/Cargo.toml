[package]
name = "kbd-wasm"
version = "0.1.0"
edition = "2024"
publish = false
description = "kbd-engine for WebAssembly hosts: a C ABI of integers and byte buffers, which the ChromeOS input method drives"

[lib]
crate-type = ["cdylib"]

[dependencies]
kbd-engine = { path = "../kbd-engine" }
kbd-model = { path = "../kbd-model" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
unreachable = "deny"
