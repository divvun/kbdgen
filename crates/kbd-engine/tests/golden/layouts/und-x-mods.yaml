# Extensions around modifiers: the three extra-modifier bindings, AltGr
# through a `ctrl alt` layer, the `other` layer, a native-only `ctrl`
# layer and LRM/RLM on Shift+Backspace. Every layer differs only at C01.
format: 4
displayNames: {und: Modifiers}
hardware:
  default:
    form: iso
    impliedLayers: none
    extraModifiers: [rightCtrl, capsLock, B00]
    layers:
      none: |
        \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0}
        \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0}
        a \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0}
        \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0}
      shift: |
        \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0}
        \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0} \u{0}
