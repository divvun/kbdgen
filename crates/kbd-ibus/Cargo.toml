[package]
name = "kbd-ibus"
version = "0.1.0"
edition = "2024"
publish = false
description = "The Divvun keyboard IBus engine: ibus-engine-divvun, running kbd-engine"

[[bin]]
name = "ibus-engine-divvun"
path = "src/main.rs"

[dependencies]
kbd-engine = { path = "../kbd-engine" }
kbd-model = { path = "../kbd-model" }

[target.'cfg(unix)'.dependencies]
zbus = { version = "6.3", default-features = false, features = ["tokio", "service"] }
tokio = { version = "1.54", default-features = false, features = ["rt", "sync"] }

[dev-dependencies]
kbdgen = { path = "../.." }
tempfile = "3.3.0"

[target.'cfg(unix)'.dev-dependencies]
zbus = { version = "6.3", default-features = false, features = ["tokio", "service", "p2p"] }
tokio = { version = "1.54", default-features = false, features = ["rt", "net", "sync"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
unreachable = "deny"
